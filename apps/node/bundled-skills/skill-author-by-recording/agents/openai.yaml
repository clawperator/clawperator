interface:
  display_name: "Skill Author By Recording"
  short_description: "Author a skill from one recorded phone flow"
  default_prompt: "Use $skill-author-by-recording to turn a fresh phone recording into one truthful Clawperator skill. I will give you the plain-language goal and the target app or apps, you should close those apps before recording starts, derive the skill id after the recording, default to replay unless I explicitly ask for orchestrated or the recording already shows orchestrated is the more truthful shape, treat the first useful outcome as a personalized local skill unless it is clearly generic, disclose whether you stayed from scratch or used nearby exemplar patterns, suggest an extra recording pass when the first one looks weak, keep the retained compare baseline and orchestrated debug bundle in the expected places, and run one self-test that surfaces the SkillResult. Once recording starts, tell me clearly when it is my turn to perform the target phone flow on the device. If that self-test fails, stay in the same skill's fix loop: classify the failure, inspect the failure artifacts, patch the created skill directly, restore the same starting preconditions before each rerun, rerun `clawperator skills validate`, and rerun the same skill until it passes or a real blocker remains. Keep one live self-test per device at a time and do not wander into unrelated skills during that repair loop."
