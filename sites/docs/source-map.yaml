code_derived:
  # api/mcp.md is authored in docs/ because it includes parameter-level guidance,
  # client configuration, and verification flow that cannot be derived from code alone.
  - output: api/cli.md
    generator: scripts/generate_cli_reference.py
    sources:
      - apps/node/src/cli/registry.ts
      - apps/node/src/cli/commands/
      - sites/docs/ownership.yaml

markers:
  - page: api/errors.md
    marker: error-codes
    generator: scripts/generate_error_table.py
    sources:
      - apps/node/src/contracts/errors.ts
  - page: api/selectors.md
    marker: selector-flags
    generator: scripts/generate_selector_table.py
    sources:
      - apps/node/src/cli/selectorFlags.ts
  - page: api/mcp.md
    marker: mcp-tool-summary
    generator: scripts/generate_mcp_tool_summary.py
    sources:
      - apps/node/src/mcp/tools/
