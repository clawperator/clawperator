interface:
  display_name: "Clawperator Agent Orientation"
  short_description: "Orient an unfamiliar agent to the correct Clawperator front door"
  default_prompt: "Use $clawperator-agent-orientation when Clawperator is installed but you are not yet sure which surface to use next. Run `clawperator doctor --json` first and stop if `criticalOk` is not true (send the agent to https://docs.clawperator.com/setup/). Then run the cold-start checklist (`devices`, `snapshot --json`, `skills list --json`, `agent-skills list --json`), use the routing table to choose the correct front door (runtime skills, skill-author-by-agent-discovery, skill-author-by-recording, MCP, or raw CLI), and end with one explicit next command or one canonical doc URL for the chosen route."
