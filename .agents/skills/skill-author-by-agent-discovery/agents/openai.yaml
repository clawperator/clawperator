interface:
  display_name: "Skill Author By Agent Discovery"
  short_description: "Choose one truthful next step when no installed skill matches"
  default_prompt: "Use $skill-author-by-agent-discovery when runtime-skill discovery finds no clear match and you need a truthful first step before recording. Check installed runtime skills first, keep discovery bounded to max 5 snapshots, max 3 screenshots, and max 90 seconds, produce one discovery artifact with the required top-level keys (`recommended_next_step`, `existing_skill_verdict`, `target_app_package`, `route_confidence`, `mutation_risk`, `evidence_collected`, `discovery_budget_used`, conditional `skill_classification`, `handoff_target`, and `handoff_reasoning`), record `discovery_budget_used` with `snapshots`, `screenshots`, and `elapsed_wall_time_s`, choose exactly one route (`use_existing_skill`, `proceed_to_recording`, `iterate_discovery`, `one_shot_direct_automation`, `escalate_to_human`, or `decline`), and never author a durable runtime skill directly inside discovery. Default to autonomous device driving when the current host can control the device, and ask for human intervention only for real blockers such as sign-in, MFA, CAPTCHA, biometric gates, payment approval, or another explicit human-consent step. When the route is `proceed_to_recording`, hand off to $skill-author-by-recording with the observed app route, evidence, mutation notes, classification, autonomous-drive expectation, and any known blockers."
