interface:
  display_name: "Clawperator Upgrade"
  short_description: "Upgrade Clawperator through the canonical installer and verify readiness"
  default_prompt: "Use $clawperator-upgrade only when this machine already has Clawperator and the user or calling workflow has explicitly chosen a whole-product upgrade. Treat missing upgrade intent as a stop condition, not as permission to mutate the host. Once explicit upgrade intent is established, run `curl -fsSL https://clawperator.com/install.sh | bash`, then run `clawperator doctor --json`, report whether `criticalOk` is true, and end with one explicit next command or one canonical repair link. Do not replace the installer with `npm install -g clawperator@latest`, `clawperator skills update`, or `clawperator agent-skills update` as the primary path."
