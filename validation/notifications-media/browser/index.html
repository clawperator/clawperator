<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser audio proof</title>
<style>body { font: 24px sans-serif; padding: 24px } audio { width: 100% }</style>
<h1>Browser audio proof</h1>
<p>Local generated audio, played by the browser's native audio element.</p>
<audio controls loop src="tone.wav"></audio>
<p id="evidence"></p>
<script>
const player = document.querySelector('audio');
setInterval(() => {
  document.querySelector('#evidence').textContent =
    `Actual audio position: ${player.currentTime.toFixed(2)} seconds. Paused: ${player.paused}.`;
}, 250);
</script>
</html>
