interface:
  display_name: "Clawperator Upgrade"
  short_description: "Upgrade Clawperator through the CLI-first install route, verify prerequisites, and confirm readiness"
  default_prompt: "Use $clawperator-upgrade only when this machine already has Clawperator and the user or calling workflow has explicitly chosen a whole-product upgrade. Treat missing upgrade intent as a stop condition, not as permission to mutate the host. First check `clawperator --version`. If it succeeds, verify the installer-owned prerequisites with `node -v` and `java -version` before mutating the host. Only continue on the CLI-first upgrade path when Node is 24+ and Java is 17 or 21, then run `npm install -g clawperator@latest`, `clawperator install`, and `clawperator doctor --json`. If `clawperator --version` is not reachable, or the Node/Java prerequisites are not already satisfied, use `curl -fsSL https://clawperator.com/install.sh | bash` as recovery only, then re-check CLI reachability before continuing. End with one explicit next command or one canonical repair link. Do not make install.sh the primary path."
