interface:
  display_name: "Clawperator Agent Orientation"
  short_description: "Orient an unfamiliar agent to the correct Clawperator front door"
  default_prompt: "Use $clawperator-agent-orientation when Clawperator is installed but you are not yet sure which surface to use next. Run `clawperator doctor --json` first and stop if `criticalOk` is not true (send the agent to https://docs.clawperator.com/setup/). Then run `clawperator devices`, choose an explicit `--device <device_serial>` if multiple devices are connected, pick exactly one front door (runtime skills, skill-author-by-agent-discovery, skill-author-by-recording, MCP, or raw CLI), run the smallest truthful first probe for that route, and end with one explicit next command plus one canonical doc URL for the chosen route."
