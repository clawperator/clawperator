interface:
  display_name: "Clawperator Upgrade"
  short_description: "Upgrade Clawperator through the CLI-first install route, verify prerequisites, and confirm readiness"
  default_prompt: "Use $clawperator-upgrade only when this machine already has Clawperator and the user or calling workflow has explicitly chosen a whole-product upgrade. Treat missing upgrade intent as a stop condition, not as permission to mutate the host. First check `clawperator --version`. If it fails, run the PATH discovery gate before routing to install.sh: exit code 127 means command not found in the current shell, not proof the tool is absent; capture `$PATH`, probe `command -v` for each tool, and on macOS probe `/opt/homebrew/bin/brew` and `/usr/local/bin/brew` before concluding Homebrew is missing -- if found outside PATH, activate with the discovered absolute path, for example `eval \"$(/opt/homebrew/bin/brew shellenv)\"` or `eval \"$(/usr/local/bin/brew shellenv)\"`, then retry. If `clawperator --version` succeeds (original or after PATH repair), verify the installer-owned prerequisites with `node -v`, `npm -v`, and `java -version`; classify any failure through the same PATH gate before deciding to use install.sh. Only continue on the CLI-first upgrade path when Node is 24+, npm is reachable, and Java is 17 or 21, then run `npm install -g clawperator@latest`, `clawperator install`, and `clawperator doctor`. If the install result has `deviceSelectionRequired: true` or doctor reports `MULTIPLE_DEVICES_DEVICE_ID_REQUIRED`, run `clawperator doctor --device <device_id>` for each connected device before claiming readiness. If the CLI is still not reachable after PATH classification, use `curl -fsSL https://clawperator.com/install.sh | bash` as recovery only, then re-check CLI reachability before continuing. End with one explicit next command or one canonical repair link. Do not make install.sh the primary path. JSON is already the CLI default; do not add --output json to command snippets."
