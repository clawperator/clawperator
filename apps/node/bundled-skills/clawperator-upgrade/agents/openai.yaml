interface:
  display_name: "Clawperator Upgrade"
  short_description: "Upgrade Clawperator through the canonical installer and verify readiness"
  default_prompt: "Use $clawperator-upgrade only when this machine already has Clawperator and the user or calling workflow has explicitly chosen a whole-product upgrade. Treat missing upgrade intent as a stop condition, not as permission to mutate the host. First check `clawperator --version`. If it succeeds, run the CLI-first upgrade sequence in order: `npm install -g clawperator@latest`, `clawperator operator remediate`, `clawperator bundled-skills update`, `clawperator skills install`, `clawperator host setup`, and `clawperator doctor --json`. If `clawperator --version` is not reachable, use `curl -fsSL https://clawperator.com/install.sh | bash` as recovery only, then re-check CLI reachability before continuing. End with one explicit next command or one canonical repair link. Do not make install.sh the primary path."
