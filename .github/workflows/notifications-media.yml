name: Notification and media live proof
on:
  workflow_dispatch:
jobs:
  live-api35:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
      - uses: android-actions/setup-android@v3
      - name: Build and offline checks
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          npm --prefix apps/node ci
          npm --prefix apps/node run build
          node --test apps/node/dist/test/unit/notificationMedia.test.js
          ./gradlew :app:assembleDebug :notification-media-fixture:assembleDebug :shared:core:toolkit:testDebugUnitTest :shared:data:operator:testDebugUnitTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash validation/notifications-media/ci-device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notifications-media-api35
          path: artifacts/notifications-media/
